apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: home-namespace
  name: configure-cluster
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["create", "delete", "list"] 
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: home-namespace
  name: monitor-cluster
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: home-namespace
  name: read-secrets
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list"]